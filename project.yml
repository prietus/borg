name: BorgMac
options:
  bundleIdPrefix: com.carlos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
schemes:
  BorgMac:
    build:
      targets:
        BorgMac: all
        BorgMacWidget: [test, run]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BorgMacWidget:
    build:
      targets:
        BorgMacWidget: all
    run:
      config: Debug

targets:
  BorgMac:
    type: application
    platform: macOS
    sources:
      - path: BorgMac
      - path: Shared
    dependencies:
      - target: BorgMacWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlos.BorgMac
        PRODUCT_NAME: BorgMac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: BorgMac
        INFOPLIST_KEY_LSUIElement: YES

  BorgMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: BorgMacWidget
      - path: Shared
    info:
      path: BorgMacWidget/Info.plist
      properties:
        CFBundleDisplayName: BorgMacWidget
        CFBundleName: BorgMacWidget
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlos.BorgMac.Widget
        PRODUCT_NAME: BorgMacWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: BorgMacWidget/BorgMacWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
